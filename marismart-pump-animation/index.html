<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARISMART Pump Skid</title>
<style>
  :root { --ink:#1b2430; --muted:#55606e; --panel:rgba(255,255,255,.92); --line:#d5dbe2; }
  html,body { margin:0; background:#eef1f4; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color:var(--ink); overflow:hidden; }
  #stage { position:relative; width:1920px; height:1080px; transform-origin:0 0; }
  #c { position:absolute; inset:0; width:1920px; height:1080px; }
  #hud-top { position:absolute; left:44px; top:32px; right:44px; display:flex; justify-content:space-between; align-items:flex-start; gap:24px; }
  .eyebrow { font-size:17px; letter-spacing:.14em; text-transform:uppercase; color:#9b2c3a; font-weight:600; }
  #clipname { font-size:40px; font-weight:700; margin-top:4px; }
  #status { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 18px; font-size:20px; max-width:760px; font-weight:600; }
  #hud-bottom { position:absolute; left:44px; right:44px; bottom:28px; }
  #caption { display:inline-block; background:#1b2430; color:#fff; font-size:27px; font-weight:600; padding:12px 20px; border-radius:8px; }
  #extra { margin-top:10px; font-size:18px; color:var(--muted); line-height:1.45; }
  #labels { position:absolute; inset:0; pointer-events:none; }
  .label { position:absolute; transform:translate(-50%,-100%); display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 12px 6px 6px; font-size:20px; font-weight:600; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .label.active { outline:3px solid #f08a00; }
  .tag { color:#fff; border-radius:6px; padding:3px 9px; font-size:18px; font-weight:700; }
  .note { position:absolute; transform:translate(-50%,0); background:#fff8e1; border:1px dashed #b88a00; border-radius:8px; padding:6px 10px; font-size:17px; max-width:330px; white-space:normal; line-height:1.3; }
  #controls { display:none; position:fixed; left:12px; bottom:12px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px; gap:8px; align-items:center; font-size:14px; z-index:5; }
  body.viewer #controls { display:flex; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="labels"></div>
  <div id="hud-top">
    <div><div class="eyebrow">MARISMART AR · Visual learning · Illustrative model</div><div id="clipname"></div></div>
    <div id="status"></div>
  </div>
  <div id="hud-bottom"><div id="caption"></div><div id="extra"></div></div>
</div>
<div id="controls">
  <select id="clipSel"><option value="1">Clip 1 — Disassembly</option><option value="2">Clip 2 — Reassembly</option><option value="3">Clip 3 — Motion &amp; flow</option></select>
  <input id="scrub" type="range" min="0" max="1000" value="0" style="width:320px">
  <button id="play">Play</button>
</div>
<script>
  function fit(){ if(!document.body.classList.contains('viewer'))return; const s=Math.min(innerWidth/1920,innerHeight/1080); document.getElementById('stage').style.transform=`scale(${s})`; }
  addEventListener('resize',fit); addEventListener('load',()=>setTimeout(fit,50));
</script>
<script type="module" src="./src/app.js"></script>
</body>
</html>
